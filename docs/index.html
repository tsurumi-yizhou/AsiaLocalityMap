<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>此地 · Asia Locality Map</title>
<meta name="description" content="Android 离线历史地图应用。定位到当前位置，直接浏览当地的历史底图。支持中、日、韩界面。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="seal" aria-hidden="true">此</span>
      <span class="brand-text">此地</span>
      <span class="brand-sub">Asia Locality Map</span>
    </a>
    <nav class="site-nav">
      <a href="index.html" aria-current="page">介绍</a>
      <a href="product.html">资料约定</a>
      <a href="data-rights.html">来源许可</a>
      <a href="open-source.html">开源</a>
      <a href="privacy.html">隐私</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">

    <p class="vertical-mark" aria-hidden="true">一地一图 · 各有其时</p>

    <h1>此刻你站的地方，历史上叫什么</h1>

    <h2><span class="idx">01</span>界面</h2>

    <div class="device-pair">
      <figure class="phone-shot">
        <span class="device-tag">手机 · 南阳</span>
        <img src="assets/screenshots/phone-zh-Hans-map.png" alt="手机中文界面，地图停留在南阳附近，标注南阳县" loading="lazy">
      </figure>
      <figure>
        <span class="device-tag">平板 · 同一位置</span>
        <img src="assets/screenshots/tablet-zh-Hans-map.png" alt="平板中文界面，地图停留在南阳附近" loading="lazy">
      </figure>
    </div>

    <div class="shot-group">
      <figure class="phone-shot">
        <img src="assets/screenshots/phone-ja-map.png" alt="日文界面手机地图，京都" loading="lazy">
        <figcaption>日文 · 京都</figcaption>
      </figure>
      <figure class="phone-shot">
        <img src="assets/screenshots/phone-ko-map.png" alt="韩文界面手机地图，首尔" loading="lazy">
        <figcaption>韩文 · 首尔</figcaption>
      </figure>
    </div>

    <div class="device-pair">
      <figure class="phone-shot">
        <span class="device-tag">手机 · 底部面板</span>
        <img src="assets/screenshots/phone-ja-search.png" alt="手机日文界面，底部检索面板展开" loading="lazy">
      </figure>
      <figure>
        <span class="device-tag">平板 · 侧栏</span>
        <img src="assets/screenshots/tablet-ja-search.png" alt="平板日文界面，检索以侧栏展开" loading="lazy">
      </figure>
    </div>

    <h2><span class="idx">02</span>数据</h2>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>来源</th>
            <th class="num">原始记录</th>
            <th class="num">本应用使用</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>CHGIS 县级治所时序</td><td class="num">10,522</td><td class="num">1,434</td></tr>
          <tr><td>CHGIS 府级治所时序</td><td class="num">5,226</td><td class="num">255</td></tr>
          <tr><td>CHGIS 府级辖区时序</td><td class="num">3,830</td><td class="num">231</td></tr>
          <tr><td>明代卫所驻地点</td><td class="num">375</td><td class="num">375</td></tr>
          <tr><td>日本旧国／旧郡</td><td class="num">85 国、806 郡</td><td class="num">68 国、715 郡</td></tr>
          <tr><td>朝鲜道级／府郡县级空间记录</td><td class="num">1,013</td><td class="num">9 道级、335 府郡县级</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <nav>
      <a href="index.html">介绍</a>
      <a href="product.html">资料约定</a>
      <a href="data-rights.html">来源许可</a>
      <a href="open-source.html">开源</a>
      <a href="privacy.html">隐私</a>
    </nav>
  </div>
</footer>

</body>
</html>
