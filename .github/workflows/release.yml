name: Release to Google Play internal testing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name, for example 0.1.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check publishing credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Secret: $name"
              exit 1
            fi
          done

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Determine release version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_VERSION_CODE_BASE: ${{ vars.ANDROID_VERSION_CODE_BASE || '1' }}
        run: python .github/scripts/release_version.py

      - name: Install data preparation dependencies
        run: python -m pip install -r requirements.txt

      - name: Download, prepare and validate offline research data
        run: |
          python scripts/download_sources.py
          python scripts/fetch_japan.py
          python scripts/prepare_data.py
          python -m unittest discover -s tests -v

      - name: Restore upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-upload.jks"

      - name: Build signed release bundle and run lint
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/play-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: >-
          ./gradlew --no-daemon --stacktrace
          -PreleaseVersionCode="$RELEASE_VERSION_CODE"
          -PreleaseVersionName="$RELEASE_VERSION_NAME"
          :app:bundleRelease :app:lintRelease

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: asia.locality.map
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})

      - name: Upload release lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-lint-reports
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove upload keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/play-upload.jks"
