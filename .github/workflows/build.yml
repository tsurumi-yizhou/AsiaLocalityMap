name: Test build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Prepare empty offline assets for the test build
        shell: bash
        run: |
          # Research datasets are local only; CI checks compilation with empty assets.
          mkdir -p data/processed/android
          : > data/processed/android/map.jsonl
          printf '[]\n' > data/processed/android/land.json

      - name: Build debug APKs and run lint
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          :app:lintDebug
          :app:lintRelease

      - name: Upload test APKs without research data
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-apks-no-map-data
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7
